name: Update live GitHub statistics
on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/update-stats.yml']
permissions:
  contents: write
concurrency:
  group: profile-statistics
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test statistics updater
        run: node --test scripts/update-stats.test.mjs
      - name: Fetch all statistics
        run: node scripts/update-stats.mjs
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
      - name: Commit successful statistics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: refresh live GitHub statistics'
          git push
