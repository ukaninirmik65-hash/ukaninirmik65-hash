name: Update profile activity

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [profile-update]
  pull_request:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'README.md'
      - '.github/workflows/update-profile.yml'
  watch:
    types: [started]
  fork:

permissions:
  contents: read

concurrency:
  group: profile-activity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref != format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the proposed changes
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Test the data pipeline
        run: npm test

      - name: Validate the committed README and assets
        run: npm run validate

  refresh:
    if: >-
      github.repository == 'ukaninirmik65-hash/ukaninirmik65-hash' &&
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name != 'push' || github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the profile branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Test the data pipeline
        run: npm test

      - name: Fetch public data and render the profile
        id: generate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        shell: bash
        run: |
          status=0
          npm run update || status=$?
          case "$status" in
            0) printf 'stale=false\n' >> "$GITHUB_OUTPUT" ;;
            2) printf 'stale=true\n' >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac

      - name: Validate the generated README and assets
        run: npm run validate

      - name: Commit changed generated assets
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
          PROFILE_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            README.md \
            assets/profile-data.json \
            assets/github-statistics.svg \
            assets/language-distribution.svg
          if git diff --cached --quiet; then
            echo "Public data is unchanged; no commit needed."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh public profile activity'
          askpass="$(mktemp "${RUNNER_TEMP}/profile-askpass.XXXXXX")"
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'ASKPASS'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_PUSH_TOKEN" ;;
          esac
          ASKPASS
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            git push origin "HEAD:refs/heads/${PROFILE_BRANCH}"

      - name: Report incomplete data refresh
        if: steps.generate.outputs.stale == 'true'
        run: |
          echo '::error::At least one public data section could not refresh. The profile retains its last verified data where available.'
          exit 1
