<svg xmlns="http://www.w3.org/2000/svg" width="420" height="486" viewBox="0 0 420 486" role="img" aria-labelledby="title desc"><title id="title">GitHub statistics</title><desc id="desc">Public repositories, received stars and forks, followers, and available public contribution metrics. These numbers are generated from GitHub data.</desc><defs><linearGradient id="accent" x2="1" y2="1"><stop stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA"/></linearGradient></defs><style>text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#F8FAFC}.muted{fill:#94A3B8}.cyan{fill:#22D3EE}.purple{fill:#A78BFA}.small{font-size:11px}.label{font-size:12px;fill:#94A3B8}.value{font-size:27px;font-weight:700}.title{font-size:20px;font-weight:700}</style><rect width="420" height="486" rx="20" fill="#0B1120"/><rect x="0.5" y="0.5" width="419" height="485" rx="19.5" fill="none" stroke="#233149"/><text x="28" y="38" class="title">GitHub statistics</text><text x="28" y="62" class="label">Public account data · snapshot 2026-11-12</text><rect x="28" y="78" width="42" height="3" rx="1.5" fill="url(#accent)"/><text x="28" y="118" class="value">9</text><text x="28" y="139" class="label">Public repositories</text><text x="212" y="118" class="value">1</text><text x="212" y="139" class="label">Stars received</text><text x="28" y="196" class="value">0</text><text x="28" y="217" class="label">Forks received</text><text x="212" y="196" class="value">5</text><text x="212" y="217" class="label">Followers</text><text x="28" y="274" class="value cyan">108</text><text x="28" y="295" class="label">Contributions · YTD</text><text x="212" y="274" class="value">82</text><text x="212" y="295" class="label">Public commits · YTD</text><text x="28" y="352" class="value">2</text><text x="28" y="373" class="label">Pull requests · YTD</text><text x="212" y="352" class="value">0</text><text x="212" y="373" class="label">Issues · YTD</text><text x="28" y="430" class="val