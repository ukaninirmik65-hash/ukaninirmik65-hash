<svg xmlns="http://www.w3.org/2000/svg" width="420" height="440" viewBox="0 0 420 440" role="img" aria-labelledby="title desc"><title id="title">Public repository languages and contribution streaks</title><desc id="desc">Language percentages measure GitHub repository source bytes, not proficiency. Current streak includes yesterday when today is still in progress. Both streaks are limited to the displayed calendar year.</desc><defs><linearGradient id="accent" x2="1" y2="1"><stop stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA"/></linearGradient></defs><style>text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#F8FAFC}.muted{fill:#94A3B8}.cyan{fill:#22D3EE}.purple{fill:#A78BFA}.small{font-size:11px}.label{font-size:12px;fill:#94A3B8}.value{font-size:27px;font-weight:700}.title{font-size:20px;font-weight:700}</style><rect width="420" height="440" rx="20" fill="#0B1120"/><rect x="0.5" y="0.5" width="419" height="439" rx="19.5" fill="none" stroke="#233149"/><text x="28" y="38" class="title">Code &amp; consistency</text><text x="28" y="63" class="label">Language composition · original public repositories</text><rect x="28.00" y="88" width="156.53" height="9" fill="#22D3EE"/><rect x="184.53" y="88" width="102.23" height="9" fill="#A78BFA"/><rect x="286.76" y="88" width="77.98" height="9" fill="#34D399"/><rect x="364.74" y="88" width="27.26" height="9" fill="#60A5FA"/><circle cx="32" cy="122" r="4" fill="#22D3EE"/><text x="43" y="126" class="small">JavaScript 43.0%</text><circle cx="214" cy="122" r="4" fill="#A78BFA"/><text x="225" y="126" class="small">TypeScript 28.1%</text><circle cx="32" cy="148" r="4" fill="#34D399"/><text x="43" y="152" class="small">CSS 21.4%</text><circle cx="214" cy="148" r="4" fill="#60A5FA"/><text x="225" y="152" class="small">HTML 7.5%</text><text x="28" y="222" class="muted small">GitHub language bytes · excludes forks · snapshot 2026-11-05</text><text x="28" y="276" class="value cyan">4 days</text><text x="28" y="299" class="label">Current contribution streak</text><text x="28" y="349" class="value purple">4 days</text><text x="28" y="372" class="label">Longest streak · calendar year</text><text x="28" y="398" class="muted small">Through 2026-11-05 · UTC calendar dates</text></svg>
